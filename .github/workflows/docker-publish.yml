name: Docker publish

on:
  push:
    branches: [main]
  schedule:
    # weekly rebuild picks up new PHP 7.4 security builds from packages.sury.org
    - cron: "0 3 * * 1"
  workflow_dispatch:

env:
  IMAGE: yohannaftali/php7-fpm

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: PHP_VERSION=7.4
          pull: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:7.4
          push: true

  description:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: yohannaftali/php7-fpm
          short-description: "PHP 7.4-FPM (sury.org, patched) on Debian 13: extensions, sendmail, Xdebug. TZ Asia/Jakarta."
          readme-filepath: ./README.md
